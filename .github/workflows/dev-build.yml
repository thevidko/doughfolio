# Dev channel — every merge to develop publishes the `edge` Docker image.
name: Dev build

on:
  push:
    branches: [develop]

# A newer merge supersedes any in-flight edge build.
concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  edge-image:
    name: Publish edge image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:edge

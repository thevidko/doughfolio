# Quality gate — runs on every PR and every push to main.
# Pushes to develop are checked inside the "Dev build" workflow, which gates
# the edge image on the same checks (no duplicate runs).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
